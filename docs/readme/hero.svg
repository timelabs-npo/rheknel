<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d"><title id="t">Rheknel — the stone Cronus cannot digest</title><desc id="d">A black invariant stone suspended inside a bright geometric gate, with OK, REJECT, and ESCALATE verdict paths.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbd8"/><stop offset=".48" stop-color="#e9fbff"/><stop offset="1" stop-color="#b7c7ff"/></linearGradient><radialGradient id="stone"><stop stop-color="#424858"/><stop offset="1" stop-color="#090b12"/></radialGradient></defs><rect width="1600" height="760" rx="42" fill="url(#bg)"/><g transform="translate(1170 380)"><path d="M-278-245C-82-342 226-222 283-24 61 49 42 213-8 322-139 254-281 115-298-54c-7-71 2-133 20-191Z" fill="#ff4e68" opacity=".9"/><circle r="220" fill="#fff" stroke="#102446" stroke-width="8"/><circle r="146" fill="none" stroke="#1c76ff" stroke-width="22" stroke-dasharray="60 24"/><path d="M-76-101c48-58 126-39 160 28 39 78 3 171-78 196-72 22-148-25-157-99-7-54 32-91 75-125Z" fill="url(#stone)" stroke="#102446" stroke-width="6"/><path d="M-11-286v78m258 140-73 22M168 213l-58-57M-209 185l63-54" stroke="#102446" stroke-width="8"/></g><g font-family="system-ui,Segoe UI,sans-serif" fill="#102446"><text x="78" y="112" font-size="34" font-weight="800" letter-spacing="5">RHEKNEL</text><text x="78" y="215" font-size="80" font-weight="950">THE STONE CRONUS</text><text x="78" y="294" font-size="80" font-weight="950">CANNOT DIGEST.</text><text x="82" y="382" font-size="28" font-weight="800">Probabilistic systems may advise. The invariant gate gets the last word.</text><text x="82" y="444" font-size="22">tag → judges → short-circuit verdict → action dispatch</text><text x="82" y="526" font-size="22" font-weight="900" fill="#ff365b">OK · REJECT · ESCALATE</text><text x="82" y="604" font-size="20" font-weight="900">ΚΡΟΝΟΣ ≠ ΧΡΟΝΟΣ.</text><text x="300" y="604" font-size="20">Cronus is not Chronos. Ambiguity is a bug.</text></g><g font-family="ui-monospace,monospace" font-weight="900" fill="#102446"><text x="1034" y="76" font-size="17">DETERMINISTIC NO</text><text x="1372" y="385" font-size="17">ESCALATE</text><text x="1084" y="708" font-size="17">REJECT</text><text x="836" y="385" font-size="17">OK</text></g></svg>